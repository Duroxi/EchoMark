name: Deploy EchoMark to Production

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "server/"
          target: "/home/ruoxi/EchoMark/"
          overwrite: true

      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            cd /home/ruoxi/EchoMark/server
            
            # 写入环境配置（从 GitHub Secrets 注入）
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env
            
            # 更新依赖（分开安装避免冲突）
            source /home/ruoxi/envs/echomark/bin/activate
            pip install fastapi uvicorn psycopg2-binary pydantic apscheduler passlib bcrypt PyYAML python-dotenv --quiet
            
            # 重启服务
            kill $(cat /home/ruoxi/echomark.pid 2>/dev/null) 2>/dev/null || true
            sleep 2
            nohup python3 -m uvicorn main:app --host 0.0.0.0 --port 9527 > /home/ruoxi/echomark.log 2>&1 &
            echo $! > /home/ruoxi/echomark.pid
            sleep 3
            curl -sf http://localhost:9527/docs > /dev/null && echo "✅ Deploy OK" || (echo "❌ FAILED" && tail -20 /home/ruoxi/echomark.log && exit 1)
